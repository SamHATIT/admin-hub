# Digital Humans - Site Vitrine + Admin Hub
server {
    listen 80;
    listen [::]:80;
    server_name digital-humans.fr www.digital-humans.fr;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digital-humans.fr www.digital-humans.fr;
    
    ssl_certificate /etc/letsencrypt/live/digital-humans.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital-humans.fr/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    root /var/www/digital-humans.fr;
    index index.html;
    
    access_log /var/log/nginx/digital-humans-ssl-access.log;
    error_log /var/log/nginx/digital-humans-ssl-error.log;
    
    # API proxy to backend (for email verification)
    location /api/leads {
        proxy_pass http://localhost:8002/api/leads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ====== ADMIN HUB ======
    
    # Admin Hub API → proxy to backend port 3100
    location /admin/api/ {
        proxy_pass http://localhost:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    
    # Admin Hub Frontend → static files + SPA fallback
    location /admin {
        alias /var/www/digital-humans.fr/admin;
        try_files $uri $uri/ /admin/index.html;
    }
    
    # ====== END ADMIN HUB ======
    
    # Static files (site vitrine)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
